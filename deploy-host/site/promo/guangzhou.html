<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Гуанчжоу: Кантонская башня и Жемчужная река</title>
<style>
  :root { --bg:#0a0f14; --card:#0f1720; --line:#1e2a35; --accent:#8fd6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(120% 100% at 50% 0%, #16222e 0%, #0a1016 55%, #05080b 100%);
         color:#dce8f7; font:15px/1.5 "Baloo 2", Fredoka, Inter, system-ui, sans-serif; min-height:100vh; }
  header { text-align:center; padding:26px 16px 8px; }
  h1 { margin:0 0 6px; font-size:clamp(19px,3vw,28px); color:var(--accent); }
  .sub { opacity:.75; font-size:14px; }
  .stage { max-width:1160px; margin:16px auto; padding:0 12px 34px; }
  .shot { border:6px solid #0a0e12; border-radius:20px; overflow:hidden; background:#0a0e12;
          box-shadow:0 26px 70px rgba(0,0,0,.6); }
  .shot img { display:block; width:100%; height:auto; }
  .cap { padding:10px 16px; background:linear-gradient(#121a22,#0c1219); font-weight:700; font-size:16px;
         border-top:3px solid #0a0e12; }
  .cap small { display:block; font-weight:500; opacity:.7; font-size:13px; margin-top:2px; }
  .dots { display:flex; gap:8px; justify-content:center; margin:14px 0 0; }
  .dot { width:12px; height:12px; border-radius:50%; background:#22303c; border:2px solid #0a0e12; cursor:pointer; }
  .dot.on { background:#3f93cc; }
  .nav { display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
  .btn { border:4px solid #0a0e12; border-radius:14px; padding:10px 18px; cursor:pointer; font-weight:800;
         background:linear-gradient(#8fd6ff,#2f9fe0); color:#04223a; box-shadow:0 6px 0 #0a0e12;
         font-family:inherit; font-size:14px; text-decoration:none; display:inline-block; }
  .btn.blue { background:linear-gradient(#6cf0a8,#12c46b); color:#06231a; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #0a0e12; }
  .facts { max-width:1160px; margin:0 auto 16px; padding:0 12px; display:grid;
           grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; }
  .fact { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .fact b { display:block; color:#ffd05a; font-size:17px; }
  .fact span { font-size:12px; opacity:.7; }
  footer { text-align:center; padding:6px 16px 40px; opacity:.6; font-size:13px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>🏯 Гуанчжоу: башня и река</h1>
  <div class="sub">Кантонская башня на берегу Жемчужной реки — и что с неё видно</div>
</header>

<div class="facts">
  <div class="fact"><b>60 ярусов</b><span>скрученная решётка</span></div>
  <div class="fact"><b>44-й этаж</b><span>смотровая площадка</span></div>
  <div class="fact"><b>3 трамвайчика</b><span>на воде</span></div>
  <div class="fact"><b>2 пилона</b><span>вантовый мост</span></div>
</div>

<div class="stage">
  <div class="shot">
    <img id="pic" src="/images/promo/gz-01.png" alt="Слайд" />
    <div class="cap"><span id="title">Башня и река</span><small id="note">Кантонская башня на берегу</small></div>
  </div>
  <div class="dots" id="dots"></div>
  <div class="nav">
    <button class="btn" id="prev">◀ Назад</button>
    <button class="btn blue" id="next">Дальше ▶</button>
    <a class="btn" href="/?build=1&tab=gz&notutor=1" target="_blank" rel="noopener">Открыть Гуанчжоу</a>
    <a class="btn" href="/?build=1&tab=gz&cam=deck&notutor=1" target="_blank" rel="noopener">Вид с башни</a>
  </div>
</div>

<footer>Кадры из живой игры · <a href="/promo/beijing.html">Пекин</a> · <a href="/promo/planets.html">планеты</a> · <a href="/promo/lift.html">лифт</a></footer>

<script>
(function () {
  var SLIDES = [
    ['Башня и река', 'Скрученная решётка, смотровая площадка, красный шпиль', '/images/promo/gz-01.png'],
    ['С башни', 'Вниз на реку: лодки, набережная, вантовый мост', '/images/promo/gz-02.png'],
    ['С реки', 'Башня поднимается между жилыми кварталами', '/images/promo/gz-03.png'],
    ['Ночь', 'Подсветка башни и огни набережной', '/images/promo/gz-04.png']
  ];
  var i = 0, timer = null;
  var pic = document.getElementById('pic'), title = document.getElementById('title');
  var note = document.getElementById('note'), dots = document.getElementById('dots');
  SLIDES.forEach(function (s, k) {
    var d = document.createElement('div');
    d.className = 'dot' + (k === 0 ? ' on' : '');
    d.onclick = function () { show(k); restart(); };
    dots.appendChild(d);
  });
  function show(n) {
    i = (n + SLIDES.length) % SLIDES.length;
    pic.src = SLIDES[i][2]; title.textContent = SLIDES[i][0]; note.textContent = SLIDES[i][1];
    Array.prototype.forEach.call(dots.children, function (d, k) { d.className = 'dot' + (k === i ? ' on' : ''); });
  }
  function restart() { if (timer) clearInterval(timer); timer = setInterval(function () { show(i + 1); }, 4400); }
  document.getElementById('next').onclick = function () { show(i + 1); restart(); };
  document.getElementById('prev').onclick = function () { show(i - 1); restart(); };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ') { show(i + 1); restart(); }
    if (e.key === 'ArrowLeft') { show(i - 1); restart(); }
  });
  var x0 = null;
  document.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; });
  document.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) { show(i + (dx < 0 ? 1 : -1)); restart(); }
    x0 = null;
  });
  restart();
})();
</script>
</body>
</html>
